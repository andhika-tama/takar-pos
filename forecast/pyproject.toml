[project]
name = "takar-forecast"
version = "0.1.0"
description = "Takar demand forecasting and restock service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.30,<1",
    "statsforecast==2.1.1",
    "utilsforecast>=0.2.17,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
evaluation = ["datasetsforecast==1.1.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
